# Settings grid for scripts/split_corrs.R
#
# Every combination of region x onset x window x stimuli x average x blanks is
# computed. To add a setting, add it here rather than copying the script.
# Read with the Posit
# `config` package; add a section other than `default` (selected with
# R_CONFIG_ACTIVE) to override settings on a given machine.

default:
  regions: [V1, V2, V4, IT]

  # bin of stimulus presentation
  stim_idx: 50

  # averaging windows, in 10 ms bins
  windows: [10, 15]

  # onset schemes, in bins after stimulus presentation. A per-region list gives
  # fixed onsets; "median" uses the floored median of the per-site onsets in
  # data_path("onsets").
  onsets:
    earlier: {V1: 3, V2: 4, V4: 5, IT: 6}
    median: median

  # non-blank stimuli included
  #   all:          noisy (coherence 1) and naturalistic (coherence 2)
  #   noisy:        coherence 1 only
  #   naturalistic: coherence 2 only
  stimuli: [all, noisy, naturalistic]

  # what trials are averaged over before correlating halves, and the blank
  # handling allowed for each
  #   image:  each sample image (coherence, family, id)
  #   family: each texture family within a coherence (under `all`, 35
  #           families x 2 coherences = 70 groups, 71 with aggregated blanks)
  # blank handling
  #   none:       blanks excluded
  #   aggregated: all blanks share one label (one image / one family)
  #   separated:  each blank id is its own image (100 images); image only,
  #               since blanks have no family structure
  averages:
    image: [none, aggregated, separated]
    family: [none, aggregated]

  # default output, relative to the project root
  out: data/processed/20261104/split_corrs.csv
